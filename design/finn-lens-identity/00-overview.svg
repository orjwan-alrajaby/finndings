<text x="40" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#191919" text-anchor="start">Five directions for the Lens symbol</text>
<text x="40" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#707070" text-anchor="start">FINN shows you cars. FINN Lens helps you see them.</text>
<text x="40" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#191919" text-anchor="start">One rule holds all five together: FINN's four letters contain no closed shape. Lens supplies the circle FINN never draws — and blue always means glass.</text>
